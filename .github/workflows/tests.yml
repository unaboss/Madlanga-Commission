name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest commission_research/tests/python -q

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("DBI", "RSQLite", "dplyr", "lubridate", "stringr",
            "jsonlite", "digest", "httr", "testthat", "withr"))'
      - name: Run R tests
        run: Rscript -e 'testthat::test_dir("commission_research/tests/r", stop_on_failure = TRUE)'
